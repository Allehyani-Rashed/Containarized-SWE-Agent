User tinyproxy
Group tinyproxy

Port 8888
Listen 0.0.0.0

Timeout 600
PidFile "/tmp/tinyproxy.pid"
LogLevel Info
Syslog On

Allow 0.0.0.0/0

DisableViaHeader Yes
ViaProxyName "codex-egress-proxy"

Filter "/etc/tinyproxy/filter.list"
FilterURLs On
FilterDefaultDeny Yes
FilterExtended On

ConnectPort 80
ConnectPort 443
